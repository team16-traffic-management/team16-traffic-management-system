name: Traffic Management CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up MinGW-w64 on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make
      - name: Add MinGW to PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/msys64/ucrt64/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain
        shell: bash
        run: g++ --version && make --version
      - name: Build application and tests
        shell: bash
        run: make clean all build/test-traffic-management
      - name: Run automated tests
        shell: bash
        run: ./build/test-traffic-management
      - name: Smoke-test default application
        shell: bash
        run: ./build/traffic-management
      - name: Smoke-test config-driven multi-intersection startup
        shell: bash
        run: ./build/traffic-management examples/multi_intersection.cfg
      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer
        if: runner.os == 'Linux'
        shell: bash
        run: make sanitize
      - name: Upload Linux executable
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: traffic-management-linux
          path: build/traffic-management
          if-no-files-found: error
          retention-days: 14
