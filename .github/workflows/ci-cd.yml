name: Traffic Management CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up MinGW-w64 on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make
      - name: Add MinGW to PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/msys64/ucrt64/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain
        shell: bash
        run: g++ --version && make --version
      - name: Verify missing compiler diagnostic
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          output="$(make check-deps CXX=missing-tms-compiler 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "Expected missing compiler dependency to fail" >&2
            exit 1
          fi
          grep -Fq "Error: C++ compiler 'missing-tms-compiler' was not found" <<< "$output"
      - name: Build application and tests
        shell: bash
        run: make clean all build/test-traffic-management
      - name: Run automated tests
        shell: bash
        run: ./build/test-traffic-management
      - name: Smoke-test default application
        shell: bash
        run: ./build/traffic-management
      - name: Smoke-test config-driven multi-intersection startup
        shell: bash
        run: ./build/traffic-management examples/multi_intersection.cfg
      - name: Smoke-test baseline test fixture
        shell: bash
        run: ./build/traffic-management tests/data/baseline.cfg
      - name: Smoke-test zero-value test fixture
        shell: bash
        run: ./build/traffic-management tests/data/zero_values.cfg
      - name: Smoke-test high-load connected-intersection fixture
        shell: bash
        run: ./build/traffic-management tests/data/high_load.cfg
      - name: Verify invalid-value fixture is rejected
        shell: bash
        run: |
          if ./build/traffic-management tests/data/invalid_values.cfg; then
            echo "Expected invalid_values.cfg to be rejected"
            exit 1
          fi
      - name: Verify missing config file is rejected with a clear error
        shell: bash
        run: |
          set +e
          output="$(./build/traffic-management tests/data/does_not_exist.cfg 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "Expected missing config file to be rejected" >&2
            exit 1
          fi
          grep -Fq "Could not open configuration file: tests/data/does_not_exist.cfg" <<< "$output"
      - name: Verify corrupted fixture is rejected
        shell: bash
        run: |
          if ./build/traffic-management tests/data/corrupted.cfg; then
            echo "Expected corrupted.cfg to be rejected"
            exit 1
          fi
      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer
        if: runner.os == 'Linux'
        shell: bash
        run: make sanitize
      - name: Install Valgrind
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Execute Test Plan v1.2 acceptance cases
        shell: bash
        env:
          EVIDENCE_DIR: build/evidence
          # Hosted Windows runners have no interactive console for CTRL_C_EVENT;
          # the real Ctrl+C case runs locally on Windows and via SIGINT on Linux.
          TMS_SKIP_CONSOLE_CTRL_C: ${{ runner.os == 'Windows' && '1' || '' }}
        run: bash scripts/run_acceptance.sh
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence-${{ runner.os }}
          path: build/evidence
          if-no-files-found: error
          retention-days: 30
      - name: Upload Linux executable
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: traffic-management-linux
          path: build/traffic-management
          if-no-files-found: error
          retention-days: 14

  portability-compare:
    name: Cross-platform output comparison (TC-Port-01-P)
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Linux and Windows acceptance evidence
        uses: actions/download-artifact@v4
        with:
          pattern: acceptance-evidence-*
          path: evidence
      - name: Compare simulation output for the same config and seed
        shell: bash
        run: |
          linux=evidence/acceptance-evidence-Linux/portability_output_linux.txt
          windows=evidence/acceptance-evidence-Windows/portability_output_windows.txt
          diff -u <(tr -d '\r' < "$linux") <(tr -d '\r' < "$windows")
          echo "TC-Port-01-P: Linux and Windows builds produced identical output for tests/data/baseline.cfg"

  coverage:
    name: Source line and branch coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install gcovr
        run: python -m pip install --upgrade gcovr
      - name: Build, execute and collect coverage for application and tests
        shell: bash
        run: bash scripts/run_coverage.sh
      - name: Upload line and branch coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: traffic-management-coverage
          path: |
            build/coverage/*.html
            build/coverage/*.css
            build/coverage/*.js
            build/coverage/coverage.xml
            build/coverage/summary_excluding_throw_branches.txt
          if-no-files-found: error
          retention-days: 30
