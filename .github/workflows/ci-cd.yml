name: Traffic Management CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install C++ build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build application
        run: make

      - name: Run smoke test
        run: make test

      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer
        run: make sanitize

      - name: Package executable
        uses: actions/upload-artifact@v4
        with:
          name: traffic-management-linux
          path: build/traffic-management
          if-no-files-found: error
          retention-days: 14
