name: Traffic Management CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up MinGW-w64 on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make
      - name: Add MinGW to PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/msys64/ucrt64/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain
        shell: bash
        run: g++ --version && make --version
      - name: Verify missing compiler diagnostic
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          output="$(make check-deps CXX=missing-tms-compiler 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "Expected missing compiler dependency to fail" >&2
            exit 1
          fi
          grep -Fq "Error: C++ compiler 'missing-tms-compiler' was not found" <<< "$output"
      - name: Build application and tests
        shell: bash
        run: make clean all build/test-traffic-management
      - name: Run automated tests
        shell: bash
        run: ./build/test-traffic-management
      - name: Smoke-test default application
        shell: bash
        run: ./build/traffic-management
      - name: Smoke-test config-driven multi-intersection startup
        shell: bash
        run: ./build/traffic-management examples/multi_intersection.cfg
      - name: Smoke-test baseline test fixture
        shell: bash
        run: ./build/traffic-management tests/data/baseline.cfg
      - name: Smoke-test zero-value test fixture
        shell: bash
        run: ./build/traffic-management tests/data/zero_values.cfg
      - name: Smoke-test high-load connected-intersection fixture
        shell: bash
        run: ./build/traffic-management tests/data/high_load.cfg
      - name: Verify invalid-value fixture is rejected
        shell: bash
        run: |
          if ./build/traffic-management tests/data/invalid_values.cfg; then
            echo "Expected invalid_values.cfg to be rejected"
            exit 1
          fi
      - name: Verify missing config file is rejected with a clear error
        shell: bash
        run: |
          set +e
          output="$(./build/traffic-management tests/data/does_not_exist.cfg 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "Expected missing config file to be rejected" >&2
            exit 1
          fi
          grep -Fq "Could not open configuration file: tests/data/does_not_exist.cfg" <<< "$output"
      - name: Verify corrupted fixture is rejected
        shell: bash
        run: |
          if ./build/traffic-management tests/data/corrupted.cfg; then
            echo "Expected corrupted.cfg to be rejected"
            exit 1
          fi
      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer
        if: runner.os == 'Linux'
        shell: bash
        run: make sanitize
      - name: Upload Linux executable
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: traffic-management-linux
          path: build/traffic-management
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Source line and branch coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install gcovr
        run: python -m pip install --upgrade gcovr
      - name: Build, execute and collect coverage for application and tests
        shell: bash
        run: bash scripts/run_coverage.sh
      - name: Upload line and branch coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: traffic-management-coverage
          path: |
            build/coverage/index.html
            build/coverage/coverage.xml
          if-no-files-found: error
          retention-days: 30
