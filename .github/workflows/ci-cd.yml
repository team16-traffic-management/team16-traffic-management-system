name: Traffic Management CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, test and package (C++14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install compiler and Make
        run: sudo apt-get update && sudo apt-get install --yes build-essential
      - name: Verify toolchain
        run: g++ --version && make --version
      - name: Build application and test executable
        run: make clean all build/test-traffic-management
      - name: Run unit tests
        run: ./build/test-traffic-management
      - name: Run application smoke test
        run: ./build/traffic-management
      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer
        run: make sanitize
      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: traffic-management-linux
          path: build/traffic-management
          if-no-files-found: error
          retention-days: 14
