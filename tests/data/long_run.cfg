# 10,000-tick connected, adaptive, emergency-enabled run for leak checks
# (TC-Rel-01-P, TC-Rob-003-P) under Valgrind / LeakSanitizer.
total_ticks=10000
arrival_rate=0.5
emergency_probability=0.05
adaptive_mode=true
queue_capacity=15
green_duration=10
yellow_duration=3
red_duration=10
max_preemption_delay=4
max_green_extension=10
intersection.Central.lanes=North,South,East,West
intersection.Riverside.lanes=North,South,East,West
connection.Central=Riverside
